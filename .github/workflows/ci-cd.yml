name: CI-CD

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch: {}

jobs:
  # BUILD (tous les builds dans un seul job logique)
  build:
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: dev-${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build microservices
        run: |
          mvn -f auth-service/pom.xml clean package -DskipTests
          mvn -f event-service/pom.xml clean package -DskipTests
          mvn -f config-server/pom.xml clean package -DskipTests
          mvn -f eureka-server/pom.xml clean package -DskipTests
          mvn -f gateway-service/pom.xml clean package -DskipTests

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build front
        working-directory: front
        run: |
          npm ci
          npm run build

      - name: Build frontAdmin
        working-directory: frontAdmin
        run: |
          npm ci
          npm run build

      - name: Build workflow-service
        working-directory: workflow-service
        run: |
          npm ci
          npm run build || echo "pas de build dédié"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build ai-service
        working-directory: ai-service
        run: |
          pip install -r requirements.txt
          python -m py_compile $(find . -name "*.py")

  # TEST (tous les tests dans un seul job)
  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Tests front
        working-directory: front
        run: |
          npm ci
          npm test -- --watch=false --browsers=ChromeHeadless || echo "tests simples"

      - name: Tests frontAdmin
        working-directory: frontAdmin
        run: |
          npm ci
          npm test -- --watch=false --browsers=ChromeHeadless || echo "tests simples"

      - name: Tests workflow-service
        working-directory: workflow-service
        run: |
          npm ci
          npm test || echo "tests simples"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Tests ai-service
        working-directory: ai-service
        run: |
          pip install -r requirements.txt
          pytest || echo "tests simples"

  # ANALYZE (Semgrep et SonarQube)
  analyze_semgrep:
    name: analyze_semgrep
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Semgrep
        run: |
          python3 -m pip install --upgrade pip
          pip install semgrep

      - name: Run Semgrep
        run: |
          semgrep scan --config p/ci --error

  analyze_sonar:
    name: analyze_sonar
    runs-on: ubuntu-latest
    needs: test
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # recommandé pour SonarQube

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-

      # ---- Java services via Maven ----
      - name: Sonar - auth-service
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          mvn -f auth-service/pom.xml -B verify -DskipTests \
           org.sonarsource.scanner.maven:sonar-maven-plugin:5.5.0.6356:sonar \
            -Dsonar.host.url=${SONAR_HOST_URL} \
            -Dsonar.token=${SONAR_TOKEN} \
            -Dsonar.projectKey=smartevent-ia-auth \
            -Dsonar.projectName="smartevent-ia-auth"

      - name: Sonar - event-service
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          mvn -f event-service/pom.xml -B verify -DskipTests \
           org.sonarsource.scanner.maven:sonar-maven-plugin:5.5.0.6356:sonar \
            -Dsonar.host.url=${SONAR_HOST_URL} \
            -Dsonar.token=${SONAR_TOKEN} \
            -Dsonar.projectKey=smartevent-ia-event \
            -Dsonar.projectName="smartevent-ia-event"

      - name: Sonar - config-server
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          mvn -f config-server/pom.xml -B verify -DskipTests \
           org.sonarsource.scanner.maven:sonar-maven-plugin:5.5.0.6356:sonar \
            -Dsonar.host.url=${SONAR_HOST_URL} \
            -Dsonar.token=${SONAR_TOKEN} \
            -Dsonar.projectKey=smartevent-ia-config \
            -Dsonar.projectName="smartevent-ia-config"

      - name: Sonar - eureka-server
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          mvn -f eureka-server/pom.xml -B verify -DskipTests \
           org.sonarsource.scanner.maven:sonar-maven-plugin:5.5.0.6356:sonar \
            -Dsonar.host.url=${SONAR_HOST_URL} \
            -Dsonar.token=${SONAR_TOKEN} \
            -Dsonar.projectKey=smartevent-ia-eureka \
            -Dsonar.projectName="smartevent-ia-eureka"

      - name: Sonar - gateway-service
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          mvn -f gateway-service/pom.xml -B verify -DskipTests \
           org.sonarsource.scanner.maven:sonar-maven-plugin:5.5.0.6356:sonar \
            -Dsonar.host.url=${SONAR_HOST_URL} \
            -Dsonar.token=${SONAR_TOKEN} \
            -Dsonar.projectKey=smartevent-ia-gateway \
            -Dsonar.projectName="smartevent-ia-gateway"

      # ---- Analyse front ----
      - name: Sonar - front
        working-directory: front
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          npx sonar-scanner \
            -Dsonar.projectKey=smartevent-front \
            -Dsonar.projectName="smartevent-front" \
            -Dsonar.sources=src \
            -Dsonar.host.url=${SONAR_HOST_URL} \
            -Dsonar.login=${SONAR_TOKEN}

      - name: Sonar - frontAdmin
        working-directory: frontAdmin
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          npx sonar-scanner \
            -Dsonar.projectKey=smartevent-front-admin \
            -Dsonar.projectName="smartevent-front-admin" \
            -Dsonar.sources=src \
            -Dsonar.host.url=${SONAR_HOST_URL} \
            -Dsonar.login=${SONAR_TOKEN}

      - name: Sonar - workflow-service
        working-directory: workflow-service
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          npx sonar-scanner \
            -Dsonar.projectKey=smartevent-workflow \
            -Dsonar.projectName="smartevent-workflow" \
            -Dsonar.sources=src \
            -Dsonar.host.url=${SONAR_HOST_URL} \
            -Dsonar.login=${SONAR_TOKEN}

      # ---- analyse ai-service ----
      - name: Install SonarScanner CLI
        run: |
          curl -sSLo sonar-scanner.zip \
            https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-5.0.1.3006-linux.zip
          unzip sonar-scanner.zip
          mv sonar-scanner-*/ sonar-scanner
          echo "${PWD}/sonar-scanner/bin" >> $GITHUB_PATH

      - name: SonarQube analysis (ai-service)
        working-directory: ai-service
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          sonar-scanner \
            -Dsonar.projectKey=smartevent-ai \
            -Dsonar.sources=. \
            -Dsonar.python.version=3.11 \
            -Dsonar.host.url=${SONAR_HOST_URL} \
            -Dsonar.login=${SONAR_TOKEN}

  # DOCKER BUILD & PUSH
  docker-build:
    runs-on: ubuntu-latest
    needs: [analyze_semgrep, analyze_sonar]
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_TAG: dev-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build images (core + ui)
        run: |
          docker compose -f docker-compose.yml -f docker-compose.prod.yml build --pull
          
      - name: Tag also as "dev"
        run: |
          # tag "dev" en plus du tag unique
          export IMAGE_TAG=dev
          docker compose -f docker-compose.yml -f docker-compose.prod.yml build --pull

      - name: Push images (core + ui)
        run: |
          export IMAGE_TAG=dev-${GITHUB_SHA}
          docker compose -f docker-compose.yml -f docker-compose.prod.yml push
          export IMAGE_TAG=dev
          docker compose -f docker-compose.yml -f docker-compose.prod.yml push 



  # DEPLOY
  deploy:
    runs-on: self-hosted
    needs: docker-build
    permissions:
      contents: read
      packages: read
    env:
      IMAGE_TAG: dev-${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      - name: Prepare SSH key for VM
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p ~/.ssh
          KEY_FILE=~/.ssh/deploy_key
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Rsync infra to VM
        shell: bash
        run: |
          set -euxo pipefail
          SRC="$GITHUB_WORKSPACE"
          VM_USER="${{ secrets.DEPLOY_USER }}"
          VM_HOST="${{ secrets.DEPLOY_HOST }}"
          VM_DST="/home/tresor/smartevent-ia-infra"
          KEY_FILE=~/.ssh/deploy_key

          # créer dossiers côté VM
          ssh -i "$KEY_FILE" "$VM_USER@$VM_HOST" "mkdir -p '$VM_DST/docker' '$VM_DST/config-repo'"

          # compose files à la racine (sans --delete)
          rsync -avz \
            -e "ssh -i $KEY_FILE" \
            "$SRC/docker-compose.yml" \
            "$SRC/docker-compose.prod.yml" \
            "$VM_USER@$VM_HOST:$VM_DST/"

          # docker/ -> VM_DST/docker (avec --delete)
          rsync -avz --delete \
            -e "ssh -i $KEY_FILE" \
            "$SRC/docker/" \
            "$VM_USER@$VM_HOST:$VM_DST/docker/"

          # config-repo/ -> VM_DST/config-repo (avec --delete)
          rsync -avz --delete \
            -e "ssh -i $KEY_FILE" \
            "$SRC/config-repo/" \
            "$VM_USER@$VM_HOST:$VM_DST/config-repo/"

      - name: Deploy on VM (pull from GHCR)
        uses: appleboy/ssh-action@v1
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: GHCR_PAT
          script: |
            set -euxo pipefail
            export IMAGE_TAG="dev-${{ github.sha }}"
            # login GHCR SUR LA VM
            echo "$GHCR_PAT" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            cd "$HOME/smartevent-ia-infra"
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
            docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile ui up -d --remove-orphans
            docker ps

      - name: Cleanup SSH key
        if: always()
        shell: bash
        run: |
          rm -f ~/.ssh/deploy_key

            